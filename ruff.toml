# Strict from the first commit (Power of Ten rule 10).
line-length = 100
target-version = "py312"

[lint]
select = ["E", "F", "W", "B", "SIM", "PL", "RUF"]
# Magic-number comparisons are normal in tests and protocol code (exit codes, byte offsets).
ignore = ["PLR2004"]

[lint.pylint]
max-statements = 50
max-branches = 12

[lint.per-file-ignores]
# MCP tool functions: the signature IS the tool's argument schema that agents see. Grouping
# arguments into a dict (how the CLI modules meet the 5-argument limit) would hide them from the
# schema, so the argument-count rules are off for this one file.
"mcp/server.py" = ["PLR0913", "PLR0917"]
