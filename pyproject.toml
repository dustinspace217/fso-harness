[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fso-harness"
version = "0.1.0"
description = "Headless automation harness for FreeSpace Open, built for AI agents"
requires-python = ">=3.12"
license = {text = "Unlicense"}
dependencies = []

[project.scripts]
fsoctl = "fsoctl.cli:main"

[tool.setuptools.packages.find]
include = ["fsoctl*"]

[tool.setuptools.package-data]
fsoctl = ["bridge/**/*"]

[tool.mutmut]
# Mutation testing (workspace QA): mutate the package, run the unit tier.
source_paths = ["fsoctl"]
# Files the unit tier reads as fixtures (tests/test_d_docs.py, test_guide.py, test_examples.py,
# test_network_default.py reads mcp/server.py, test_sound.py reads pytest.ini, test_census.py
# reads probes/xplat/census.py; mutmut 3.7 copies a listed FILE without making its
# parent folder, __main__.py:292, so create mutants/mcp first);
# mutmut copies only source_paths and tests into mutants/ otherwise (mutmut 3.7 configuration.py:
# also_copy). Copies already in mutants/ can go stale: a baseline that fails on a doc or Lua file
# means delete mutants/ and rerun (QA sound MU-8, 2026-10-15).
also_copy = ["docs/research", "docs/AGENT-GUIDE.md", "examples", "mcp/server.py", "pytest.ini",
             "probes"]
# This test starts the real runner with `python -P` from a temporary folder; inside mutants/ the
# trampolined package cannot find mutmut's config from there, so it fails the baseline (Weston QA
# 2026-11-20). It guards the runner's start, not mutated logic; it runs in the normal unit tier.
# test_platform_parity compares the Linux and Windows modules' signatures, which mutmut's
# trampolines change, and test_text_encoding reads the source's syntax tree, which in mutants/ is
# mutmut's generated code; neither has mutated logic to judge.
pytest_add_cli_args = ["--deselect",
                       "tests/test_launcher_unit.py::test_the_runner_never_loads_code_from_the_folder_fsoctl_was_typed_in",
                       "--deselect", "tests/test_platform_parity.py",
                       "--deselect", "tests/test_text_encoding.py"]
# Mutants of safefs's tree remover that turn a folder handle into None act on the WORKING
# folder, which is mutants/ (os.scandir(None) lists ".", dir_fd=None resolves names against
# "."): five exist (clear_tree 5 and 10, remove_tree 6 and 12, _empty 22 on 2026-11-13), and
# one emptied mutants/ that day. Run mutmut on safefs inside a read-only bwrap jail with only
# mutants/ writable (plus a private /tmp and runtime folder), and leave those five out of the
# run: they are killed in effect (they delete the test tree). Running tests from a temp folder
# instead does not work: mutmut's trampoline in a runner subprocess reads its config from the
# working folder.
